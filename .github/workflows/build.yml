name: Build Play Store AAB

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 17

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Add Android Platform
        run: |
          npx cap add android
          npx cap sync android

      - name: Generate Release Keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/app/release.jks \
            -alias decaludo \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "DecaLudo2026SecureKey" \
            -keypass "DecaLudo2026SecureKey" \
            -dname "CN=DecaLudo, OU=Mobile, O=DecaLudo, L=Bangalore, S=Karnataka, C=IN"

      - name: Build Signed Android App Bundle (.aab)
        working-directory: ./android
        run: |
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=release.jks \
            -Pandroid.injected.signing.store.password=DecaLudo2026SecureKey \
            -Pandroid.injected.signing.key.alias=decaludo \
            -Pandroid.injected.signing.key.password=DecaLudo2026SecureKey

      - name: Upload Play Store AAB
        uses: actions/upload-artifact@v4
        with:
          name: decaludo-playstore-bundle
          path: android/app/build/outputs/bundle/release/app-release.aab
