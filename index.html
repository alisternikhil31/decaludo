
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>DecaLudo: Grand Arena</title>
  <style>
    :root {
      --bg: #090b10;
      --card-bg: rgba(18, 22, 34, 0.85);
      --border-color: rgba(255, 255, 255, 0.1);
      --text-main: #f0f4fc;
      --text-dim: #94a3b8;
      --gold: #f59e0b;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: radial-gradient(circle at center, #141b2d 0%, var(--bg) 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      touch-action: manipulation;
    }
    header {
      width: 100%;
      max-width: 900px;
      padding: 12px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border-color);
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.5px;
      background: linear-gradient(135deg, #f59e0b, #ec4899, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .badge {
      font-size: 0.65rem;
      background: rgba(245, 158, 11, 0.2);
      color: var(--gold);
      border: 1px solid rgba(245, 158, 11, 0.4);
      padding: 2px 6px;
      border-radius: 999px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .hud-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .btn {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:active {
      transform: scale(0.96);
    }
    .btn.active {
      border-color: #38bdf8;
      background: rgba(56, 189, 248, 0.2);
      color: #38bdf8;
    }
    main {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 10px;
      gap: 12px;
    }
        .arena-container {
      position: relative;
      width: 95vw;
      max-width: 500px;
      height: 95vw;
      max-height: 500px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 0 auto;
    }
    canvas {
      width: 100% !important;
      height: 100% !important;
      display: block;
      border-radius: 50%;
      cursor: pointer;
    }

    .action-bar {
      width: 100%;
      max-width: 540px;
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 12px 16px;
      display: grid;
      grid-template-columns: auto 1fr auto;
      align-items: center;
      gap: 14px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    .current-turn-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .turn-swatch {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 10px currentColor;
    }
    .turn-details {
      display: flex;
      flex-direction: column;
    }
    .turn-name {
      font-weight: 700;
      font-size: 0.95rem;
    }
    .turn-status {
      font-size: 0.72rem;
      color: var(--text-dim);
    }
    .dice-container {
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .dice-btn {
      width: 54px;
      height: 54px;
      border-radius: 12px;
      background: linear-gradient(145deg, #1f293d, #111827);
      border: 2px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1.8rem;
      font-weight: 900;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5), inset 0 1px 1px rgba(255, 255, 255, 0.2);
      transition: transform 0.15s, border-color 0.2s;
    }
    .dice-btn:active {
      transform: scale(0.92);
    }
    .dice-btn.rolling {
      animation: shake 0.4s infinite;
      border-color: var(--gold);
    }
    @keyframes shake {
      0% { transform: rotate(0deg) scale(1); }
      25% { transform: rotate(-8deg) scale(1.05); }
      50% { transform: rotate(8deg) scale(1.05); }
      75% { transform: rotate(-5deg) scale(1); }
      100% { transform: rotate(0deg) scale(1); }
    }
    .scoreboard {
      width: 100%;
      max-width: 540px;
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 6px;
    }
    .score-chip {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      font-size: 0.7rem;
      transition: all 0.2s;
    }
    .score-chip.active {
      border-color: currentColor;
      background: rgba(255, 255, 255, 0.08);
      transform: translateY(-2px);
    }
    .chip-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    .chip-name {
      font-weight: 600;
      font-size: 0.68rem;
      text-overflow: ellipsis;
      white-space: nowrap;
      overflow: hidden;
      max-width: 100%;
    }
    .chip-tokens {
      display: flex;
      gap: 2px;
    }
    .token-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.2);
    }
    .token-dot.home {
      background: var(--gold);
      box-shadow: 0 0 4px var(--gold);
    }
    .rules-banner {
      width: 100%;
      max-width: 540px;
      background: rgba(245, 158, 11, 0.08);
      border: 1px dashed rgba(245, 158, 11, 0.3);
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 0.72rem;
      color: #fcd34d;
      line-height: 1.4;
      text-align: center;
    }
    #log {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-style: italic;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <h1>DECALUDO</h1>
      <span class="badge">10 Players</span>
    </div>
    <div class="hud-controls">
      <button class="btn" id="soundToggle">🔊 Sound</button>
      <button class="btn" id="speedToggle">⚡ 1x</button>
      <button class="btn" id="autoToggle">🤖 Bots</button>
    </div>
  </header>

  <main>
    <div class="arena-container">
      <canvas id="board" width="1080" height="1080"></canvas>
    </div>

    <div class="action-bar">
      <div class="current-turn-indicator">
        <div class="turn-swatch" id="turnSwatch"></div>
        <div class="turn-details">
          <span class="turn-name" id="turnName">Player 1</span>
          <span class="turn-status" id="turnStatus">Roll the dice</span>
        </div>
      </div>
      <div class="dice-container">
        <button class="dice-btn" id="diceBtn">🎲</button>
      </div>
      <div>
        <button class="btn" id="restartBtn">↺ Reset</button>
      </div>
    </div>

    <div class="scoreboard" id="scoreboard"></div>
    <div class="rules-banner">
      ⚡ <b>Anti-Boredom Rules:</b> Roll <b>5 or 6</b> to deploy • Central <b>Nexus Portals</b> jump +15 spaces • Rolling 6 or capturing a token grants an instant <b>Bonus Roll</b>!
    </div>
    <div id="log">Game started. Tap the dice to begin!</div>
  </main>
